name: memory-buckets
version: 0.1.0
license: MIT
description: "Claude-style memory: one Markdown file per subject, global and project scopes, hybrid search. Store is a plain directory under $HERMES_HOME/memory-buckets."
# No `kind`: Hermes detects memory providers from __init__.py and treats them
# as `exclusive`. `memory` is not a valid kind and would be downgraded.
#
# Stdlib only, so Hermes's package manager has nothing to install. Without this,
# the pyproject.toml (there for pip installs) makes the directory a PM workspace
# member, and enabling it runs `uv lock` against Hermes's own uv.lock, which a
# Nix-built Hermes doesn't have.
python_runtime: external
